[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrence2d"
version = "0.1.0"
description = "2D generalised recurrence plots + networks + joint/cross RP + sliding windows (OpenMP C++ backend)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
plot   = ["matplotlib>=3.5"]
all    = ["rasterio>=1.3", "matplotlib>=3.5"]
